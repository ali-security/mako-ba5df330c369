name: Run tests

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional pytest selector forwarded to tox posargs"
        required: false
        default: ""

jobs:
  run-test:
    name: ${{ matrix.python-version }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      # run this job using this matrix
      matrix:
        os:
          - "ubuntu-latest"
          - "windows-latest"
          - "macos-latest"
        python-version:
          - "3.7"
          - "3.8"
          - "3.9"
          - "3.10"

        exclude:
          # beaker raises warning on 3.10. only windows seems affected
          # See https://github.com/bbangert/beaker/pull/213
          - os: "windows-latest"
            python-version: "3.10"
          # moved to ubuntu-22.04 / macos-15-intel below
          - os: "ubuntu-latest"
            python-version: "3.7"
          - os: "macos-latest"
            python-version: "3.7"

        include:
          # setup-python has no CPython 3.7 build for ubuntu-24.04 (ubuntu-latest); run the 3.7 leg on ubuntu-22.04
          - os: "ubuntu-22.04"
            python-version: "3.7"
          # no prebuilt CPython 3.7 for arm64 macos-latest and building it needs the removed
          # homebrew openssl@1.1; the Intel image has a prebuilt x64 3.7
          - os: "macos-15-intel"
            python-version: "3.7"

      fail-fast: false

    # steps to run in each job. Some are github actions, others run shell commands
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # actions/setup-python cannot provision CPython 3.7/3.8 on arm64 macos-latest; this drop-in builds it when no prebuilt exists
      - name: Set up python
        uses: MatteoH2O1999/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}
          cache-build: true
          allow-build: allow

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade tox setuptools
          pip list

      # Pygments >= 2.20 changed HTML escaping of highlighted source, which breaks
      # three test_exceptions.py html-error assertions written against 2022-era Pygments
      - name: Constrain test dependencies
        shell: bash
        run: |
          python -c "import os; p = os.path.abspath('test-constraints.txt'); open(p, 'w').write('pygments<2.20\n'); open(os.environ['GITHUB_ENV'], 'a').write('PIP_CONSTRAINT=' + p + '\n')"

      - name: Run tests
        run: tox -- ${{ inputs.test-filter }}

  build-dist:
    name: build-sdist-wheel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # pin the build tooling to the release date (2022-11-15); the published wheel
      # was generated by bdist_wheel (0.38.4)
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install --index-url 'https://:2022-11-15@time-machines-pypi.sealsecurity.io/' build "setuptools==65.5.1" "wheel==0.38.4"

      # the published sdist ships the rendered Sphinx HTML under doc/ (make dist-html)
      - name: Build HTML docs
        run: |
          pip install "Sphinx==5.3.0" "sphinx-paramlinks==0.5.4" looseversion libsass
          pip install --no-deps "zzzeeksphinx==1.3.5" changelog
          cd doc/build
          python -m sphinx -b html -A mako_layout=html -d output/doctrees -T . ..

      - name: Build sdist and wheel
        run: python -m build --no-isolation

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
